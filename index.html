<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>고무팔 3D</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<!-- iOS는 data URI apple-touch-icon을 무시해서 실제 파일로 참조 (설계 문서 10절 버그 #5) -->
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#04121c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04121c; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; }
  #boot {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px;
    color: #eaf6ff; font-family: system-ui, -apple-system, sans-serif;
    background: #04121c;
    transition: opacity .4s ease;
  }
  #boot .title { font-size: 22px; font-weight: 700; letter-spacing: .04em; }
  #boot .sub { font-size: 13px; opacity: .6; }
  #boot.hidden { opacity: 0; pointer-events: none; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    padding: max(10px, env(safe-area-inset-top)) 16px 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    font-family: system-ui, -apple-system, sans-serif; color: #eaf6ff;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
    pointer-events: none;
  }
  #hud .stat { font-size: 13px; opacity: .8; line-height: 1.4; }
  #hud .stat .value { font-size: 22px; font-weight: 700; display: block; }
  #hud-pistol { font-size: 11px; display: block; margin-top: 2px; opacity: .8; }
  #hud-pistol.pistol-cooling { color: #ffb37a; }
  #status {
    position: fixed; left: 50%; bottom: 14%; transform: translateX(-50%);
    z-index: 5; text-align: center; font-family: system-ui, -apple-system, sans-serif;
    color: #eaf6ff; text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none;
  }
  #status .msg { font-size: 20px; font-weight: 700; }
  #status .msg.warn { color: #ff6b5e; animation: warn-pulse 0.6s ease-in-out infinite alternate; }
  @keyframes warn-pulse { from { opacity: .7; } to { opacity: 1; } }
  #status .hint { font-size: 13px; opacity: .75; margin-top: 4px; }
  #status:empty { display: none; }

  /* ---- 터치 조작 (모바일) ---- */
  #touch-ui { display: none; }
  body.touch-capable #touch-ui { display: block; }

  .touch-pad {
    position: fixed; bottom: max(18px, env(safe-area-inset-bottom));
    z-index: 6; display: flex; gap: 10px; user-select: none; -webkit-user-select: none;
  }
  #touch-pad-left { left: max(14px, env(safe-area-inset-left)); align-items: flex-end; }
  #touch-pad-right { right: max(14px, env(safe-area-inset-right)); align-items: center; }

  .touch-btn {
    display: flex; align-items: center; justify-content: center;
    width: 62px; height: 62px; border-radius: 50%;
    background: rgba(234, 246, 255, 0.16); border: 1.5px solid rgba(234, 246, 255, 0.4);
    color: #eaf6ff; font-size: 24px; font-family: system-ui, sans-serif;
    touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  .touch-btn:active { background: rgba(234, 246, 255, 0.32); }
  #btn-grab { width: 84px; height: 84px; font-size: 15px; font-weight: 700; }
  #btn-up { margin-bottom: 8px; }

  #rotate-notice { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    body.touch-capable #rotate-notice {
      display: flex; position: fixed; inset: 0; z-index: 20;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
      background: #04121c; color: #eaf6ff; font-family: system-ui, sans-serif; font-size: 16px;
    }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./three.module.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div class="stat">거리<span class="value" id="hud-distance">0m</span></div>
  <div class="stat" style="text-align:right;">
    보물<span class="value" id="hud-treasure">0</span>
    <span id="hud-pistol" class="pistol-ready">피스톨 준비됨</span>
  </div>
</div>
<div id="status"></div>
<div id="touch-ui">
  <div class="touch-pad" id="touch-pad-left">
    <button type="button" class="touch-btn" id="btn-left" aria-label="왼쪽">◀</button>
    <button type="button" class="touch-btn" id="btn-down" aria-label="감기/급강하">▼</button>
    <button type="button" class="touch-btn" id="btn-right" aria-label="오른쪽">▶</button>
    <button type="button" class="touch-btn" id="btn-pistol" aria-label="피스톨">총</button>
  </div>
  <div class="touch-pad" id="touch-pad-right" style="flex-direction: column;">
    <button type="button" class="touch-btn" id="btn-up" aria-label="전진 가속">▲</button>
    <button type="button" class="touch-btn" id="btn-grab" aria-label="고무팔">팔</button>
  </div>
</div>
<div id="rotate-notice">화면을 가로로 돌려주세요</div>
<div id="boot">
  <div class="title">고무팔 3D</div>
  <div class="sub">불러오는 중…</div>
</div>
<script src="physics.js"></script>
<script type="module" src="render.js"></script>
</body>
</html>
