<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>고무팔 3D</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04121c; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; }
  #boot {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px;
    color: #eaf6ff; font-family: system-ui, -apple-system, sans-serif;
    background: #04121c;
    transition: opacity .4s ease;
  }
  #boot .title { font-size: 22px; font-weight: 700; letter-spacing: .04em; }
  #boot .sub { font-size: 13px; opacity: .6; }
  #boot.hidden { opacity: 0; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./three.module.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="boot">
  <div class="title">고무팔 3D</div>
  <div class="sub">불러오는 중…</div>
</div>
<script type="module" src="render.js"></script>
</body>
</html>
